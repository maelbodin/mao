<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MAO">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>MAO Mobile</title>
<meta name="theme-color" content="#0D0F14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout : app mobile une colonne (max 480px), barre d'onglets fixe en bas, une couleur par module */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --surface2:#EEF0F4; --line:#E1E4EA;
  --fg:#12151B; --muted:#5B6372; --on-accent:#FFFFFF;
  --sport:#E11D48; --repas:#047857; --sommeil:#2563EB; --argent:#B45309;
  --sport-soft:#FDE7EC; --repas-soft:#DDF3EA; --sommeil-soft:#E3ECFD; --argent-soft:#FCEFD9;
  --ok:#047857;
  --display:"Sora", "Segoe UI", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F14; --surface:#161A22; --surface2:#1E232D; --line:#262C38;
  --fg:#EEF1F6; --muted:#9AA3B2; --on-accent:#0D0F14;
  --sport:#FF5A6A; --repas:#34D399; --sommeil:#6AA8FF; --argent:#FBBF24;
  --sport-soft:#3A1C22; --repas-soft:#14332A; --sommeil-soft:#1A2A44; --argent-soft:#3A2E14;
  --ok:#34D399; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#161A22; --surface2:#1E232D; --line:#262C38;
  --fg:#EEF1F6; --muted:#9AA3B2; --on-accent:#0D0F14;
  --sport:#FF5A6A; --repas:#34D399; --sommeil:#6AA8FF; --argent:#FBBF24;
  --sport-soft:#3A1C22; --repas-soft:#14332A; --sommeil-soft:#1A2A44; --argent-soft:#3A2E14;
  --ok:#34D399; color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sommeil);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 140px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:28px;line-height:1.15}
h2{font-size:20px}
h3{font-size:16px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:5px 10px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:99px;background:var(--muted)}
.dot.on{background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1 1 auto;min-width:0}

/* Héros séance */
.hero{background:var(--sport);color:var(--on-accent);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px}
.hero .eyebrow{color:inherit;opacity:.85}
.hero h2{font-size:32px;line-height:1}
.pill{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:color-mix(in srgb, currentColor 14%, transparent)}
.hero .note{font-size:13px;font-weight:600;background:color-mix(in srgb, var(--on-accent) 16%, transparent);border-radius:12px;padding:8px 10px}

/* Boutons */
.btn{min-height:46px;border-radius:14px;border:none;padding:0 18px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-dark{background:var(--fg);color:var(--bg)}
.btn-sport{background:var(--sport);color:var(--on-accent)}
.btn-repas{background:var(--repas);color:var(--on-accent)}
.btn-sommeil{background:var(--sommeil);color:var(--on-accent)}
.btn-argent{background:var(--argent);color:var(--on-accent)}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.btn-full{width:100%}
.link{background:none;border:none;padding:8px 0;color:var(--muted);font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}

/* Anneaux */
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;padding:4px;border-radius:16px}
.ring b{font-family:var(--mono);font-size:16px}
.ring span{font-size:12px;color:var(--muted)}

/* Tuiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tile .ico{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.tile b{font-family:var(--mono);font-size:20px}
.tile span{font-size:12px;color:var(--muted)}

/* Choix (forme, qualité) */
.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.choice{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-size:13px;font-weight:600}
.choice[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* Séance */
.seg{display:flex;gap:4px}
.seg i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.seg i.on{background:var(--sport)}
.exo h3{font-size:17px}
.sets{display:flex;flex-direction:column;gap:6px}
.sethead,.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center}
.sethead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 2px}
.set{background:var(--surface2);border-radius:14px;padding:4px 4px 4px 10px}
.set.done{background:var(--sport-soft)}
.set input{width:100%;min-width:0;min-height:40px;border:none;background:transparent;font-family:var(--mono);font-size:17px;font-weight:700;padding:0}
.set input::placeholder{color:var(--muted);font-weight:500}
.check{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.set.done .check{background:var(--sport);color:var(--on-accent);border-color:var(--sport)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sport-soft);color:var(--sport)}

/* Repas */
.meal{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:6px 6px 6px 12px}
.meal label{font-size:12px;color:var(--muted);font-weight:700;width:68px;flex:0 0 auto}
.meal input{flex:1;min-width:0;min-height:40px;border:none;background:transparent}
.meal .check{flex:0 0 auto}
.meal.done .check{background:var(--repas);color:var(--on-accent);border-color:var(--repas)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:none}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.li.done .t{text-decoration:line-through;color:var(--muted)}
.tick{width:28px;height:28px;border-radius:8px;border:2px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;color:var(--on-accent)}
.li.done .tick{background:var(--repas);border-color:var(--repas)}
.tickwrap{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;flex:0 0 auto}
details.recipe{border-top:1px solid var(--line);padding:10px 0}
details.recipe:first-of-type{border-top:none}
details.recipe summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center;gap:8px;list-style:none}
details.recipe summary::-webkit-details-marker{display:none}
details.recipe summary::after{content:"+";margin-left:auto;font-family:var(--mono);color:var(--muted)}
details.recipe[open] summary::after{content:"–"}
details.recipe ol,details.recipe ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* Formulaires */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input,.field select{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 12px;width:100%;min-width:0}
.form2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form2 .full{grid-column:1 / -1}

/* Barres */
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.chart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end;height:150px;position:relative;padding-top:8px}
.chart .col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .b{width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--sommeil);min-height:3px}
.chart .b.empty{background:var(--line)}
.chart .lbl{font-size:11px;color:var(--muted)}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}
.big{font-family:var(--mono);font-size:34px;font-weight:700;line-height:1}

/* Minuteur + toast */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(448px, calc(100% - 32px));background:var(--fg);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer .big{font-size:26px;flex:1}
.timer button{min-height:44px;border-radius:12px;border:1px solid color-mix(in srgb, var(--bg) 30%, transparent);background:transparent;color:var(--bg);font-weight:700;padding:0 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30;font-size:14px;max-width:calc(100% - 32px)}

/* Onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:15}
nav.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}
nav.tabs button{background:none;border:none;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button[aria-current="page"]{color:var(--c)}
nav.tabs button[aria-current="page"] svg{stroke-width:2.4}
@media (prefers-reduced-motion: no-preference){
  .ring circle.p{transition:stroke-dasharray .5s ease}
  .bar i{transition:width .4s ease}
}
</style>

</head>
<body>
<div class="app" id="app"></div>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<nav class="tabs" aria-label="Sections">
  <div class="in" id="tabs"></div>
</nav>

<script>
(function(){
"use strict";

/* ---------- Icônes ---------- */
const P = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  muscu:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
  repas:'<path d="M4 11h16a8 8 0 0 1-16 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/>',
  sommeil:'<path d="M20 15A8 8 0 1 1 9 4a6.5 6.5 0 0 0 11 11z"/>',
  argent:'<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/>',
  check:'<path d="M5 12l5 5 9-10"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>'
};
function ic(n,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[n]+'</svg>';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- Dates ---------- */
function key(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function monthKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function longDate(d){return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()];}
function shortDate(k){const [y,m,dd]=k.split('-').map(Number);const d=new Date(y,m-1,dd);return JOURS[d.getDay()].slice(0,3)+'. '+dd+' '+MOIS[m-1].slice(0,4)+'.';}
function weekKeys(){const t=new Date();const dow=(t.getDay()+6)%7;const mon=addDays(t,-dow);return Array.from({length:7},(_,i)=>key(addDays(mon,i)));}
function durH(coucher,reveil){
  if(!coucher||!reveil)return null;
  const [a,b]=coucher.split(':').map(Number),[c,d]=reveil.split(':').map(Number);
  let m=(c*60+d)-(a*60+b); if(m<=0)m+=1440; return Math.round(m/6)/10;
}
function fmtH(h){if(h==null)return '—';const hh=Math.floor(h),mm=Math.round((h-hh)*60);return hh+'h'+String(mm).padStart(2,'0');}
function euro(n){return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';}

/* ---------- Programme de départ (modifiable dans l'app) ---------- */
const PROG_DEFAULT=[
  {id:'push',nom:'Push',zone:'Pecs haut · Épaules · Triceps',exos:[
    {nom:'Développé incliné haltères',series:4,reps:'8-10'},
    {nom:'Développé couché',series:3,reps:'8-10'},
    {nom:'Développé militaire haltères',series:3,reps:'8-10'},
    {nom:'Élévations latérales',series:4,reps:'12-15'},
    {nom:'Écarté poulie haute vers basse',series:3,reps:'12'},
    {nom:'Extension triceps poulie',series:3,reps:'10-12'}]},
  {id:'pull',nom:'Pull',zone:'Dos en V · Biceps',exos:[
    {nom:'Tractions ou tirage vertical',series:4,reps:'6-10'},
    {nom:'Rowing barre',series:3,reps:'8-10'},
    {nom:'Tirage horizontal',series:3,reps:'10-12'},
    {nom:'Face pull',series:3,reps:'15'},
    {nom:'Curl haltères',series:3,reps:'10-12'},
    {nom:'Curl marteau',series:2,reps:'12'}]},
  {id:'legs',nom:'Legs + Abs',zone:'Jambes · Abdos',exos:[
    {nom:'Squat',series:4,reps:'6-8'},
    {nom:'Presse à cuisses',series:3,reps:'10-12'},
    {nom:'Soulevé de terre roumain',series:3,reps:'8-10'},
    {nom:'Leg curl',series:3,reps:'12'},
    {nom:'Mollets debout',series:4,reps:'12-15'},
    {nom:'Relevés de jambes',series:3,reps:'12'},
    {nom:'Crunch poulie',series:3,reps:'12-15'}]},
  {id:'upper',nom:'Upper esthétique',zone:'Épaules rondes · Bras · Haut des pecs',exos:[
    {nom:'Développé incliné machine',series:3,reps:'10'},
    {nom:'Tirage vertical prise large',series:3,reps:'10'},
    {nom:'Élévations latérales',series:4,reps:'15'},
    {nom:'Oiseau (arrière d’épaule)',series:3,reps:'15'},
    {nom:'Curl incliné',series:3,reps:'12'},
    {nom:'Barre au front',series:3,reps:'12'}]}
];
const REPAS=[['matin','Matin'],['midi','Midi'],['collation','Collation'],['soir','Soir']];
const CATS=['Courses','Sorties','Transport','Abonnements','Sport','Autre'];
const RECETTES=[
  {nom:'Riz poulet curry',temps:'20 min',ing:['1 verre de riz','1 blanc de poulet','1 c. à café de curry','1 c. à soupe de crème ou yaourt'],etapes:['Mets le riz à cuire dans l’eau bouillante salée (10–12 min).','Coupe le poulet en dés, fais-le dorer 6–8 min à la poêle avec un filet d’huile.','Ajoute le curry et la crème, mélange 1 min.','Sers sur le riz. Fais-en 2 portions pour une gamelle.']},
  {nom:'Omelette fromage',temps:'8 min',ing:['3 œufs','1 poignée de fromage râpé','Sel, poivre'],etapes:['Bats les œufs avec sel et poivre.','Verse dans une poêle chaude huilée, feu moyen.','Quand le dessus est presque pris, ajoute le fromage et plie en deux.']},
  {nom:'Pâtes thon tomate',temps:'15 min',ing:['100 g de pâtes','1 boîte de thon','3 c. à soupe de sauce tomate'],etapes:['Fais cuire les pâtes (temps sur le paquet).','Égoutte, ajoute le thon émietté et la sauce tomate.','Mélange 1 min sur le feu.']},
  {nom:'Bol yaourt flocons fruits',temps:'3 min',ing:['1 grand yaourt ou fromage blanc','40 g de flocons d’avoine','1 banane ou des fruits rouges'],etapes:['Mets le yaourt dans un bol.','Ajoute les flocons et les fruits coupés.','Option : un filet de miel.']}
];

/* ---------- État ---------- */
const S={programme:clone(PROG_DEFAULT),jours:{},mois:{},courses:{items:[]},ui:{tab:'accueil',edit:false,cancel:false},timer:null,online:false};
function clone(o){return JSON.parse(JSON.stringify(o));}
function jour(k){k=k||key();if(!S.jours[k])S.jours[k]={date:k,sommeil:null,forme:null,repas:{},seance:null};return S.jours[k];}
function moisDoc(m){m=m||monthKey();if(!S.mois[m])S.mois[m]={mois:m,budget:null,depenses:[]};return S.mois[m];}

/* ---------- Stockage : base de l'artifact, sinon cet appareil ---------- */
let db=null;
const LS='mao-mobile-v1';
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({programme:S.programme,jours:S.jours,mois:S.mois,courses:S.courses}));}catch(e){}}
function loadLocal(){try{const r=JSON.parse(localStorage.getItem(LS)||'null');if(r){S.programme=r.programme||S.programme;S.jours=r.jours||{};S.mois=r.mois||{};S.courses=r.courses||S.courses;}}catch(e){}}
const timers={};
function persist(path,getBody){
  saveLocal();
  if(!db)return;
  clearTimeout(timers[path]);
  timers[path]=setTimeout(async()=>{
    try{await db.doc(path).set(clone(getBody()));}
    catch(e){
      if(e&&e.code==='unavailable'){setTimeout(()=>{db.doc(path).set(clone(getBody())).catch(()=>toast('Pas enregistré en ligne, gardé sur ce téléphone'));},800+Math.random()*800);}
      else if(e&&e.code==='quota_exceeded'){toast('Stockage plein : supprime d’anciennes données');}
      else toast('Pas enregistré en ligne, gardé sur ce téléphone');
    }
  },500);
}
function saveJour(k){k=k||key();persist('jours/'+k,()=>jour(k));}
function saveMois(m){m=m||monthKey();persist('argent/'+m,()=>moisDoc(m));}
function saveProg(){persist('config/programme',()=>({seances:S.programme}));}
function saveCourses(){persist('config/courses',()=>S.courses);}

function initDb(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
}

/* ---------- Sauvegarde dans un fichier ---------- */
function exporter(){
  const data=JSON.stringify({app:'mao-mobile',v:1,date:new Date().toISOString(),programme:S.programme,jours:S.jours,mois:S.mois,courses:S.courses});
  const blob=new Blob([data],{type:'application/json'});
  const file=new File([blob],'mao-sauvegarde-'+key()+'.json',{type:'application/json'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Sauvegarde MAO'}).catch(()=>{});return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}
function importer(f){
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=='mao-mobile')throw 0;S.programme=d.programme||S.programme;S.jours=d.jours||{};S.mois=d.mois||{};S.courses=d.courses||{items:[]};saveLocal();render();toast('Sauvegarde restaurée');}catch(e){toast('Ce fichier n’est pas une sauvegarde MAO');}};
  r.readAsText(f);
}

/* ---------- Logique muscu ---------- */
function seancesFaites(){
  return Object.values(S.jours).filter(j=>j.seance&&j.seance.fin).sort((a,b)=>a.date<b.date?1:-1);
}
function prochaine(){
  const faites=seancesFaites();
  if(!faites.length)return S.programme[0];
  const i=S.programme.findIndex(p=>p.id===faites[0].seance.progId);
  return S.programme[(i+1)%S.programme.length]||S.programme[0];
}
function allegee(){const j=jour();return (j.sommeil&&j.sommeil.heures!=null&&j.sommeil.heures<6)||j.forme===1;}
function derniereFois(nom){
  const today=key();
  const j=Object.values(S.jours).filter(x=>x.date<today&&x.seance&&x.seance.exos).sort((a,b)=>a.date<b.date?1:-1);
  for(const x of j){
    const e=x.seance.exos.find(e=>e.nom===nom);
    if(e){const s=e.series.filter(s=>s.fait&&s.reps!=='');if(s.length)return s;}
  }
  return null;
}
function startSeance(id){
  const p=S.programme.find(p=>p.id===id);if(!p)return;
  const light=allegee();
  jour().seance={progId:p.id,nom:p.nom,debut:Date.now(),fin:null,allegee:light,exos:p.exos.map(e=>{
    const last=derniereFois(e.nom);
    const n=Math.max(2,(Number(e.series)||3)-(light?1:0));
    return {nom:e.nom,cible:e.reps,series:Array.from({length:n},(_,i)=>({kg:'',reps:'',fait:false,kgPrev:last&&last[Math.min(i,last.length-1)]?last[Math.min(i,last.length-1)].kg:''}))};
  })};
  saveJour(); S.ui.tab='muscu'; S.ui.cancel=false; wake(true); render(); window.scrollTo(0,0);
}
function weekCount(){const w=weekKeys();return w.filter(k=>S.jours[k]&&S.jours[k].seance&&S.jours[k].seance.fin).length;}

/* ---------- Minuteur de repos ---------- */
let tick=null;
function startTimer(sec){S.timer={fin:Date.now()+sec*1000};drawTimer();clearInterval(tick);tick=setInterval(drawTimer,250);}
function stopTimer(){S.timer=null;clearInterval(tick);document.getElementById('timer').hidden=true;}
function drawTimer(){
  const el=document.getElementById('timer');
  if(!S.timer){el.hidden=true;return;}
  const r=Math.max(0,Math.ceil((S.timer.fin-Date.now())/1000));
  if(r===0){stopTimer();try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}toast('Repos terminé, série suivante');return;}
  const t=String(Math.floor(r/60)).padStart(2,'0')+':'+String(r%60).padStart(2,'0');
  if(el.hidden||!el.firstChild){el.innerHTML='<span class="eyebrow" style="color:inherit;opacity:.7">Repos</span><span class="big num" id="tval"></span><button data-a="timer-plus">+30 s</button><button data-a="timer-skip">Passer</button>';el.hidden=false;}
  document.getElementById('tval').textContent=t;
}
let lock=null;
async function wake(on){try{if(on&&navigator.wakeLock){lock=await navigator.wakeLock.request('screen');}else if(lock){await lock.release();lock=null;}}catch(e){}}

/* ---------- Toast ---------- */
let tt=null;
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{el.hidden=true;},2400);}

/* ---------- Composants ---------- */
function ring(pct,color,val,label,tab){
  const C=2*Math.PI*28,p=Math.max(0,Math.min(1,pct||0));
  return '<button class="ring" data-a="tab" data-v="'+tab+'" aria-label="'+esc(label+' : '+val)+'"><svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="28" fill="none" stroke="var(--line)" stroke-width="7"/><circle class="p" cx="36" cy="36" r="28" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(C*p).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 36 36)"/></svg><b>'+esc(val)+'</b><span>'+esc(label)+'</span></button>';
}
function header(title,sub){
  return '<div class="top"><div class="stack" style="gap:4px"><span class="eyebrow">'+esc(sub)+'</span><h1>'+esc(title)+'</h1></div><span class="sync" title="Tes données sont gardées dans ton téléphone"><span class="dot on"></span>Enregistré</span></div>';
}
function repasCount(j){return ['matin','midi','soir'].filter(m=>j.repas[m]&&j.repas[m].fait).length;}

/* ---------- Écran Accueil ---------- */

  const som=j.sommeil&&j.sommeil.heures;
  const s=j.seance;
  let hero;
  if(s&&!s.fin){
    const done=s.exos.filter(e=>e.series.every(x=>x.fait)).length;
    hero='<div class="hero"><div class="row between"><span class="eyebrow">Séance en cours</span><span class="pill num">'+done+' / '+s.exos.length+'</span></div><h2>'+esc(s.nom)+'</h2><button class="btn btn-dark" style="align-self:flex-start" data-a="tab" data-v="muscu">Reprendre '+ic('arrow',16)+'</button></div>';
  }else if(s&&s.fin){
    const min=Math.round((s.fin-s.debut)/60000);
    hero='<div class="hero"><div class="row between"><span class="eyebrow">Séance du jour</span><span class="pill">Faite</span></div><h2>'+esc(s.nom)+'</h2><span>'+min+' min · bien joué. Pense à bien manger et à dormir tôt.</span></div>';
  }else{
    const p=prochaine();
    hero='<div class="hero"><div class="row between"><span class="eyebrow">Séance du jour</span><span class="pill">'+p.exos.length+' exercices</span></div><h2>'+esc(p.nom)+'</h2><span>'+esc(p.zone||'')+'</span>'+(allegee()?'<span class="note">Nuit courte ou fatigue : séance allégée, une série en moins par exercice.</span>':'')+'<div class="row wrap"><button class="btn btn-dark" data-a="start" data-v="'+esc(p.id)+'">Commencer '+ic('arrow',16)+'</button><button class="link" style="color:inherit" data-a="tab" data-v="muscu">Changer de séance</button></div></div>';
  }
  const md=moisDoc(),dep=md.depenses.reduce((a,d)=>a+Number(d.montant||0),0);
  const argentVal=md.budget!=null?euro(md.budget-dep):'À fixer';
  return header(salut+' Maël',longDate(now))
  +hero
  +'<div class="card"><div class="rings">'
    +ring(som?som/8:0,'var(--sommeil)',som?fmtH(som):'—','Sommeil','sommeil')
    +ring(weekCount()/4,'var(--sport)',weekCount()+' / 4','Séances','muscu')
    +ring(repasCount(j)/3,'var(--repas)',repasCount(j)+' / 3','Repas','repas')
  +'</div></div>'
  +'<div class="card"><div class="row between"><h3>Comment tu te sens ?</h3>'+(j.forme?'':'<span class="muted" style="font-size:13px">1 tap</span>')+'</div><div class="choices">'
    +['Crevé','Moyen','Bien','En feu'].map((l,i)=>'<button class="choice" aria-pressed="'+(j.forme===i+1)+'" data-a="forme" data-v="'+(i+1)+'">'+l+'</button>').join('')
  +'</div></div>'
  +'<div class="tiles">'
    +'<button class="tile" data-a="tab" data-v="sommeil"><span class="ico" style="background:var(--sommeil-soft);color:var(--sommeil)">'+ic('sommeil',20)+'</span><b>'+(som?fmtH(som):'Noter')+'</b><span>'+(som?'cette nuit':'ta nuit, en 2 taps')+'</span></button>'
    +'<button class="tile" data-a="tab" data-v="argent"><span class="ico" style="background:var(--argent-soft);color:var(--argent)">'+ic('argent',20)+'</span><b>'+esc(argentVal)+'</b><span>'+(md.budget!=null?'reste ce mois-ci':'ton budget du mois')+'</span></button>'
  +'</div>'
  +'<div class="card"><h3>Mes données</h3><span class="muted" style="font-size:13px">Tout est gardé dans ton téléphone. Fais une sauvegarde de temps en temps, par exemple dans Fichiers ou iCloud.</span><div class="row wrap"><button class="btn btn-ghost" data-a="export">Sauvegarder</button><label class="btn btn-ghost" for="imp">Restaurer</label><input id="imp" type="file" accept="application/json,.json" hidden></div></div>';
}

/* ---------- Écran Muscu ---------- */
function vMuscu(){
  const j=jour(),s=j.seance;
  if(S.ui.edit)return vEditProg();
  if(s&&!s.fin){
    const done=s.exos.filter(e=>e.series.every(x=>x.fait)).length;
    let h='<div class="top"><div class="stack" style="gap:4px"><span class="eyebrow">Séance en cours · '+done+' / '+s.exos.length+' exercices</span><h1>'+esc(s.nom)+'</h1></div></div>';
    h+='<div class="seg">'+s.exos.map(e=>'<i class="'+(e.series.every(x=>x.fait)?'on':'')+'"></i>').join('')+'</div>';
    if(s.allegee)h+='<div class="card" style="background:var(--sport-soft);border-color:transparent"><span style="font-weight:600">Séance allégée aujourd’hui : une série en moins. Le sommeil passe avant.</span></div>';
    s.exos.forEach((e,ei)=>{
      const last=derniereFois(e.nom);
      h+='<div class="card exo"><div class="row between" style="align-items:flex-start"><div class="stack" style="gap:2px;min-width:0"><h3>'+esc(e.nom)+'</h3><span class="muted" style="font-size:13px">Objectif '+e.series.length+' × '+esc(e.cible)+(last?' · Dernière fois : '+esc(last[0].kg||'?')+' kg × '+last.map(x=>esc(x.reps)).join(', '):'')+'</span></div>'+(e.series.every(x=>x.fait)?'<span class="badge">Fait</span>':'')+'</div>'
        +'<div class="sets"><div class="sethead"><span>Série</span><span>Kg</span><span>Reps</span><span></span></div>'
        +e.series.map((x,si)=>'<div class="set'+(x.fait?' done':'')+'"><span class="num" style="font-weight:700">'+(si+1)+'</span>'
          +'<input id="kg-'+ei+'-'+si+'" inputmode="decimal" aria-label="Kilos série '+(si+1)+'" placeholder="'+esc(x.kgPrev||'kg')+'" value="'+esc(x.kg)+'" data-k="kg" data-e="'+ei+'" data-s="'+si+'">'
          +'<input id="rp-'+ei+'-'+si+'" inputmode="numeric" aria-label="Répétitions série '+(si+1)+'" placeholder="'+esc(String(e.cible).split('-')[0])+'" value="'+esc(x.reps)+'" data-k="reps" data-e="'+ei+'" data-s="'+si+'">'
          +'<button class="check" aria-label="Série '+(si+1)+(x.fait?' faite':' à valider')+'" aria-pressed="'+x.fait+'" data-a="set" data-e="'+ei+'" data-s="'+si+'">'+ic('check',20)+'</button></div>').join('')
        +'</div><button class="link" style="align-self:flex-start" data-a="addset" data-e="'+ei+'">+ Ajouter une série</button></div>';
    });
    h+='<button class="btn btn-sport btn-full" data-a="finish">Terminer la séance</button>';
    h+=S.ui.cancel
      ?'<div class="card"><span>Annuler cette séance ? Ce que tu as noté sera effacé.</span><div class="row"><button class="btn btn-sport" data-a="cancel-yes">Oui, annuler</button><button class="btn btn-ghost" data-a="cancel-no">Non</button></div></div>'
      :'<button class="link" style="align-self:center" data-a="cancel">Annuler la séance</button>';
    return h;
  }
  const next=prochaine();
  let h=header('Muscu','Programme · '+weekCount()+' séance'+(weekCount()>1?'s':'')+' cette semaine');
  if(s&&s.fin)h+='<div class="card" style="background:var(--sport-soft);border-color:transparent"><span style="font-weight:700">'+esc(s.nom)+' faite aujourd’hui.</span><span class="muted">Récupère bien, la prochaine c’est '+esc(next.nom)+'.</span></div>';
  h+='<div class="stack">';
  S.programme.forEach(p=>{
    const isNext=p.id===next.id;
    h+='<div class="card" style="'+(isNext?'border-color:var(--sport)':'')+'"><div class="row between"><div class="stack" style="gap:2px;min-width:0"><div class="row"><h3>'+esc(p.nom)+'</h3>'+(isNext?'<span class="badge">Prochaine</span>':'')+'</div><span class="muted" style="font-size:13px">'+esc(p.zone||'')+' · '+p.exos.length+' exercices</span></div><button class="btn '+(isNext?'btn-sport':'btn-ghost')+'" data-a="start" data-v="'+esc(p.id)+'"'+(s&&s.fin?' disabled style="opacity:.5"':'')+'>Go</button></div></div>';
  });
  h+='</div><button class="btn btn-ghost btn-full" data-a="edit">'+ic('edit',18)+' Modifier mes séances</button>';
  const hist=seancesFaites().slice(0,6);
  h+='<div class="card"><h3>Historique</h3>'+(hist.length?'<div class="list">'+hist.map(x=>'<div class="li"><span class="t"><b>'+esc(x.seance.nom)+'</b> <span class="muted">· '+shortDate(x.date)+'</span></span><span class="num muted">'+Math.round((x.seance.fin-x.seance.debut)/60000)+' min</span></div>').join('')+'</div>':'<span class="muted">Tes séances terminées apparaîtront ici, avec tes charges pour la fois suivante.</span>')+'</div>';
  return h;
}

  let h='<div class="row"><button class="iconbtn" aria-label="Retour" data-a="edit-done">'+ic('back',20)+'</button><h1>Mes séances</h1></div><span class="muted">Change les exercices comme tu veux. C’est enregistré tout seul.</span>';

        +'<div class="field" style="width:56px;flex:0 0 auto"><label for="es-'+pi+'-'+ei+'">Séries</label><input id="es-'+pi+'-'+ei+'" inputmode="numeric" value="'+esc(e.series)+'" data-k="eser" data-p="'+pi+'" data-e="'+ei+'"></div>'

  h+='<button class="btn btn-sport btn-full" data-a="edit-done">C’est bon</button>';

  let h=header('Argent','Budget de '+MOIS[now.getMonth()]);
  h+='<div class="card"><div class="field"><label for="a-b">Budget du mois (€)</label><input id="a-b" inputmode="decimal" placeholder="Ex. 400" value="'+(b!=null?esc(b):'')+'" data-k="budget"></div>'
    +'<div class="row between"><div class="stack" style="gap:0"><span class="eyebrow">Reste</span><span class="big" style="color:'+(b!=null&&b-total<0?'var(--sport)':'var(--argent)')+'">'+(b!=null?euro(b-total):'—')+'</span></div><div class="stack" style="gap:0;text-align:right"><span class="eyebrow">Dépensé</span><span class="num" style="font-size:18px;font-weight:700">'+euro(total)+'</span></div></div>'
    +'<div class="bar"><i style="width:'+(pct*100).toFixed(0)+'%;background:'+(pct>=1?'var(--sport)':'var(--argent)')+'"></i></div></div>';
  h+='<form class="card" id="f-dep"><h3>Ajouter une dépense</h3><div class="form2"><div class="field"><label for="d-m">Montant (€)</label><input id="d-m" inputmode="decimal" placeholder="12,50" autocomplete="off" required></div><div class="field"><label for="d-c">Catégorie</label><select id="d-c">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select></div><div class="field full"><label for="d-l">Quoi ?</label><input id="d-l" placeholder="Courses Lidl, essence…" autocomplete="off"></div></div><button class="btn btn-argent btn-full">Ajouter</button></form>';
  if(md.depenses.length){
    const by=CATS.map(c=>[c,md.depenses.filter(d=>d.cat===c).reduce((a,d)=>a+Number(d.montant||0),0)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
    const mx=by[0][1];
    h+='<div class="card"><h3>Par catégorie</h3><div class="stack">'+by.map(([c,v])=>'<div class="stack" style="gap:4px"><div class="row between"><span>'+c+'</span><span class="num">'+euro(v)+'</span></div><div class="bar"><i style="width:'+(v/mx*100).toFixed(0)+'%;background:var(--argent)"></i></div></div>').join('')+'</div></div>';
    h+='<div class="card"><h3>Ce mois-ci</h3><div class="list">'+md.depenses.slice().reverse().map(d=>'<div class="li"><span class="t"><b>'+esc(d.label||d.cat)+'</b> <span class="muted" style="font-size:13px">· '+esc(d.cat)+' · '+shortDate(d.date)+'</span></span><span class="num">'+euro(Number(d.montant))+'</span><button class="iconbtn" style="border:none;background:none" aria-label="Supprimer '+esc(d.label||d.cat)+'" data-a="dep-del" data-v="'+esc(d.id)+'">'+ic('x',16)+'</button></div>').join('')+'</div></div>';
  }else{
    h+='<div class="card"><span class="muted">Aucune dépense ce mois-ci. Note-les au fur et à mesure, ça prend 5 secondes.</span></div>';
  }
  h+='<span class="muted" style="font-size:12px;text-align:center">Ne mets jamais de numéro de carte ou de compte ici, seulement des montants.</span>';
  return h;
}

/* ---------- Rendu ---------- */
const TABS=[['accueil','Accueil','home','var(--fg)'],['muscu','Muscu','muscu','var(--sport)'],['repas','Repas','repas','var(--repas)'],['sommeil','Sommeil','sommeil','var(--sommeil)'],['argent','Argent','argent','var(--argent)']];
function render(){
  const v={accueil:vAccueil,muscu:vMuscu,repas:vRepas,sommeil:vSommeil,argent:vArgent}[S.ui.tab]||vAccueil;
  document.getElementById('app').innerHTML=v();
  document.getElementById('tabs').innerHTML=TABS.map(([id,l,i,c])=>'<button style="--c:'+c+'" data-a="tab" data-v="'+id+'"'+(S.ui.tab===id?' aria-current="page"':'')+'>'+ic(i,22)+l+'</button>').join('');
  try{localStorage.setItem(LS+'-tab',S.ui.tab);}catch(e){}
}

/* ---------- Clics ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v,j=jour(),s=j.seance;
  const E=+b.dataset.e,Si=+b.dataset.s,Pi=+b.dataset.p;
  switch(a){
    case 'tab':S.ui.tab=v;S.ui.edit=false;S.ui.cancel=false;render();window.scrollTo(0,0);return;
    case 'start':startSeance(v);return;
    case 'set':{
      const x=s.exos[E].series[Si];
      if(!x.fait&&x.kg===''&&x.kgPrev)x.kg=x.kgPrev;
      if(!x.fait&&x.reps==='')x.reps=String(s.exos[E].cible).split('-')[0];
      x.fait=!x.fait;saveJour();
      if(x.fait){const all=s.exos.every(e=>e.series.every(y=>y.fait));if(all){stopTimer();toast('Tout est fait, termine ta séance');}else startTimer(90);}
      render();return;}
    case 'addset':{const ser=s.exos[E].series;const l=ser[ser.length-1]||{};ser.push({kg:l.kg||'',reps:'',fait:false,kgPrev:l.kgPrev||''});saveJour();render();return;}
    case 'finish':s.fin=Date.now();saveJour();stopTimer();wake(false);toast('Séance enregistrée');S.ui.tab='accueil';render();window.scrollTo(0,0);return;
    case 'cancel':S.ui.cancel=true;render();return;
    case 'cancel-no':S.ui.cancel=false;render();return;
    case 'cancel-yes':j.seance=null;S.ui.cancel=false;saveJour();stopTimer();wake(false);render();return;
    case 'timer-plus':if(S.timer){S.timer.fin+=30000;drawTimer();}return;
    case 'timer-skip':stopTimer();return;
    case 'forme':j.forme=(j.forme===+v)?null:+v;saveJour();render();return;
    case 'qualite':{const sm=j.sommeil||{coucher:val('s-c'),reveil:val('s-r')};sm.qualite=+v;sm.heures=durH(sm.coucher,sm.reveil);j.sommeil=sm;saveJour();render();return;}
    case 'sleep-save':{const c=val('s-c'),r=val('s-r');j.sommeil=Object.assign(j.sommeil||{},{coucher:c,reveil:r,heures:durH(c,r)});saveJour();toast('Nuit enregistrée : '+fmtH(j.sommeil.heures));render();return;}
    case 'repas':{const m=b.dataset.m;j.repas[m]=j.repas[m]||{texte:''};j.repas[m].fait=!j.repas[m].fait;saveJour();render();return;}
    case 'c-tog':{const x=S.courses.items[+b.dataset.i];x.fait=!x.fait;saveCourses();render();return;}
    case 'c-del':S.courses.items.splice(+b.dataset.i,1);saveCourses();render();return;
    case 'courses-clear':S.courses.items=S.courses.items.filter(x=>!x.fait);saveCourses();render();return;
    case 'dep-del':{const md=moisDoc();md.depenses=md.depenses.filter(d=>d.id!==v);saveMois();render();return;}
    case 'edit':S.ui.edit=true;render();window.scrollTo(0,0);return;
    case 'edit-done':S.ui.edit=false;render();window.scrollTo(0,0);return;
    case 'exo-add':S.programme[Pi].exos.push({nom:'Nouvel exercice',series:3,reps:'10'});saveProg();render();return;
    case 'export':exporter();return;
    case 'exo-del':S.programme[Pi].exos.splice(E,1);saveProg();render();return;
  }
});
function val(id){const el=document.getElementById(id);return el?el.value:'';}

/* ---------- Saisie (sans re-rendu, pour ne pas perdre le clavier) ---------- */
document.addEventListener('input',ev=>{
  const el=ev.target,k=el.dataset.k;if(!k)return;
  const j=jour();
  if(k==='kg'||k==='reps'){j.seance.exos[+el.dataset.e].series[+el.dataset.s][k]=el.value.replace(',','.');saveJour();}
  else if(k==='repas'){const m=el.dataset.m;j.repas[m]=j.repas[m]||{fait:false};j.repas[m].texte=el.value;saveJour();}
  else if(k==='scouch'||k==='sreveil'){const d=document.getElementById('s-dur');if(d)d.textContent=fmtH(durH(val('s-c'),val('s-r')));}
  else if(k==='budget'){const n=parseFloat(el.value.replace(',','.'));moisDoc().budget=isNaN(n)?null:n;saveMois();}
  else if(k==='pnom'){S.programme[+el.dataset.p].nom=el.value;saveProg();}
  else if(k==='enom'||k==='eser'||k==='ereps'){const e=S.programme[+el.dataset.p].exos[+el.dataset.e];if(k==='enom')e.nom=el.value;if(k==='eser')e.series=Math.max(1,Math.min(10,parseInt(el.value)||1));if(k==='ereps')e.reps=el.value;saveProg();}
});
document.addEventListener('change',ev=>{if(ev.target.dataset.k==='budget')render();if(ev.target.id==='imp'&&ev.target.files[0])importer(ev.target.files[0]);});

/* ---------- Formulaires ---------- */
document.addEventListener('submit',ev=>{
  ev.preventDefault();
  const f=ev.target;
  if(f.id==='f-courses'){const t=val('c-new').trim();if(!t)return;(S.courses.items=S.courses.items||[]).push({t:t,fait:false});saveCourses();render();const n=document.getElementById('c-new');if(n)n.focus();}
  if(f.id==='f-dep'){
    const m=parseFloat(val('d-m').replace(',','.'));
    if(isNaN(m)||m<=0){toast('Mets un montant, par exemple 12,50');return;}
    moisDoc().depenses.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),montant:m,label:val('d-l').trim(),cat:val('d-c'),date:key()});
    saveMois();toast('Dépense ajoutée : '+euro(m));render();
  }
});

/* ---------- Démarrage ---------- */
loadLocal();
try{const t=localStorage.getItem(LS+'-tab');if(t)S.ui.tab=t;}catch(e){}
render();
initDb();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){render();if(jour().seance&&!jour().seance.fin)wake(true);}});
})();
</script>
</body>
</html>
